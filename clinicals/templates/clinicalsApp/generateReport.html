<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Clinical Data Report</title>
  </head>
  <body>    
    <div class="container mt-5">
      <h1 class="mb-4">Clinical Data Report:</h1>
        <table class="table table-bordered">
          <thead>
            <th>Component Name</th>
            <th>Component Value</th>
            <th>Measure Date Time</th>
          </thead>
          {%for eachEntry in data%}
          <tr>
            <td>{{eachEntry.componentName}}</td>
            <td>{{eachEntry.componentValue}}</td>
            <td>{{eachEntry.measuredDateTime}}</td>
          </tr>
          {%endfor%}
        </table>
        <a href="/" class="btn btn-primary">Home</a>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      </div>
  </body>
</html>
