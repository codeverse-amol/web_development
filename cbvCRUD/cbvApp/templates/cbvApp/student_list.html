<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title> 
</head>
<body>
    <h1>Student List</h1>
    <table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Test Score</th>
        </tr>   
    </thead>  
    {% for student in student_list %}  
    <tr>
            <td><a href="{{ student.get_absolute_url }}">{{ student.id }}</a></td>
            <td>{{ student.firstName }}</td>
            <td>{{ student.lastName }}</td>
            <td>{{ student.testScore }}</td>
    </tr>
    {% endfor %}
    </table>
    <br><br>
    <a href="/create/">Add New Student</a>
</body>
</html>
